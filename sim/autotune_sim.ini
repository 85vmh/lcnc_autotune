# Simulated lathe for developing/testing lcnc-autotune without the machine.
# Each joint: pid (velocity mode, like stepgen velocity-cmd) -> simulated drive
# (gain G like a STEP_SCALE mismatch, two lags like a servo drive's position
# loop) -> integrator -> position feedback. Same PID start values as WeilerE30.

[EMC]
MACHINE = autotune-sim
VERSION = 1.1

[DISPLAY]
DISPLAY = ./idle-ui.sh
CYCLE_TIME = 0.1
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = COMMANDED
LATHE = 1
GEOMETRY = XZ

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = sim.var
RS274NGC_STARTUP_CODE = G7 G18 G21 G90 G95 F0.1

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 500000

[HAL]
HALUI = halui
HALFILE = autotune_sim.hal

[KINS]
JOINTS = 2
KINEMATICS = trivkins coordinates=XZ

[TRAJ]
COORDINATES = XZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 2.5
MAX_LINEAR_VELOCITY = 100.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = sim.tbl

[AXIS_X]
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 750.0
MIN_LIMIT = 0.0
MAX_LIMIT = 152.0

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 750.0
FERROR = 10
MIN_FERROR = 10
P = 50
I = 0
D = 0
FF0 = 0
FF1 = 0.81967
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 0
MAX_ERROR = 5
# simulated drive: velocity gain (1.22 = the 2440/2000 step scale mismatch), lags as lowpass gains
SIM_GAIN = 1.22
# LAG1 2 ms -> lowpass gain 1-exp(-dt/T)
SIM_LAG1_GAIN = 0.2212
# LAG2 1 ms -> lowpass gain 1-exp(-dt/T)
SIM_LAG2_GAIN = 0.3935
MIN_LIMIT = 0.0
MAX_LIMIT = 152.0
HOME = 135.0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

[AXIS_Z]
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 2000.0
MIN_LIMIT = 0.0
MAX_LIMIT = 600.0

[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 2000.0
FERROR = 20
MIN_FERROR = 10
P = 50
I = 0
D = 0
FF0 = 0
FF1 = 0.81967
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 0
MAX_ERROR = 10
SIM_GAIN = 1.22
# LAG1 3 ms -> lowpass gain 1-exp(-dt/T)
SIM_LAG1_GAIN = 0.1535
# LAG2 1.5 ms -> lowpass gain 1-exp(-dt/T)
SIM_LAG2_GAIN = 0.2835
MIN_LIMIT = 0.0
MAX_LIMIT = 600.0
HOME = 150.0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
